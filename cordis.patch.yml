# dsh-autotrans bundle patch: one insert over the profile's entry list.
#
# Registers the `autotrans` tool on the host plane, so every agent preset in
# the profile can call it. Config below are defaults; a user overrides them in
# the profile's own cordis.patch.yml by targeting the row id:
#
#   - id: tool-autotrans
#     config:
#       python: python3        # or a path to dist/autotrans/autotrans.exe
#       model: deepseek-chat
#       concurrency: 4
#
# or disables the tool entirely with `- id: tool-autotrans` + `disabled: true`.
#
# config.python forms: "auto" (default) uses a packaged runtime dropped into
# <plugin>/runtime/autotrans.exe (scripts/get-runtime.ps1) and falls back to a
# system `python`; an existing autotrans.exe / python path is used directly.

- insert:
    - id: tool-autotrans
      name: dsh-autotrans
      config:
        python: auto
        model: deepseek-chat
        concurrency: 4
        format: docx
